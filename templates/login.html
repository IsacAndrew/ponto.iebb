<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Login - Sistema de Ponto</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(160deg, #14532d 0%, #166534 45%, #1e6b3a 75%, #ca8a04 140%);
        }

        .cartao-vidro {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 32px 24px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo-wrapper {
            width: 108px;
            height: 108px;
            margin: 0 auto 18px auto;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);

            position: relative;
            overflow: hidden;
        }
        .logo-wrapper::after {
            content: "";
            position: absolute;
            top: -60%;
            left: -60%;
            width: 60%;
            height: 220%;
            background: rgba(255, 255, 255, 0.5);
            transform: rotate(25deg);
        }
        .logo-wrapper img {
            width: 78%;
            height: 78%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 21px;
            color: #ffffff;
            margin: 0 0 4px 0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .subtitulo {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 24px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #1f2937;
        }

        .campo-senha {
            position: relative;
            margin-bottom: 22px;
        }
        .campo-senha input {
            width: 100%;
            padding: 13px 46px 13px 14px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #1f2937;
        }
        .botao-olho {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;

            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .botao-olho svg { width: 22px; height: 22px; }

        button.entrar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(21, 128, 61, 0.4);
        }
        button.entrar:active {
            transform: scale(0.98);
        }

        .mensagens {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }
        .mensagens li {
            background-color: rgba(254, 226, 226, 0.95);
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="cartao-vidro">

        <div class="logo-wrapper">
            <img src="{{ url_for('static', filename='img/logo_instituto_batista.png') }}" alt="Instituto Batista">
        </div>

        <h1>Seja Bem-Vindo</h1>
        <div class="subtitulo">Insira suas credenciais para continuar</div>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                <ul class="mensagens">
                    {% for mensagem in mensagens %}
                        <li>{{ mensagem }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="identificador">Matrícula / Login</label>
            <input type="text" id="identificador" name="identificador" required autofocus autocomplete="username">

            <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" id="senha" name="senha" required autocomplete="current-password">
                <button type="button" class="botao-olho" id="botao-olho"
                        aria-label="Segure para ver a senha">
                    
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="entrar">Entrar</button>
        </form>
    </div>

    <script>
        // ------------------------------------------------------------
        // BOTÃO DE REVELAR SENHA (segurar para ver, soltar para esconder)
        // ------------------------------------------------------------
        const campoSenha = document.getElementById("senha");
        const botaoOlho = document.getElementById("botao-olho");

        function mostrarSenha() {
            campoSenha.type = "text";
        }
        function esconderSenha() {
            campoSenha.type = "password";
        }

        botaoOlho.addEventListener("mousedown", mostrarSenha);
        botaoOlho.addEventListener("touchstart", function (evento) {
            evento.preventDefault();
            mostrarSenha();
        });

        botaoOlho.addEventListener("mouseup", esconderSenha);
        botaoOlho.addEventListener("mouseleave", esconderSenha);
        botaoOlho.addEventListener("touchend", esconderSenha);
        botaoOlho.addEventListener("touchcancel", esconderSenha);
    </script>
</body>
</html>
