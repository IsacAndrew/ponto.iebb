<!--{% extends "base_admin.html" %}

{% block titulo %}Exportar Excel{% endblock %}
{% block ativo_excel %}ativo{% endblock %}

{% block conteudo %}

<style>
    .area-manutencao {
        position: relative;
        min-height: 60vh;
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255,255,255,0.4);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
    }
    .texto-manutencao {
        color: white;
        font-size: 26px;
        font-weight: bold;
        text-shadow: 0 2px 12px rgba(0,0,0,0.35);
        letter-spacing: 1px;
    }

    #modal-senha-fundo {
        display: none;
        position: fixed;
        top:0; left:0; right:0; bottom:0;
        background: rgba(0,0,0,0.55);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }
    #modal-senha-caixa {
        background: white;
        border-radius: 14px;
        padding: 22px;
        max-width: 320px;
        width: 100%;
    }
    #modal-senha-caixa label { display:block; font-size:13px; color:#444; margin-bottom:6px; }
    #modal-senha-caixa input {
        width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; margin-bottom:12px;
    }
    #modal-senha-caixa button {
        width:100%; padding:11px; background:#2563eb; color:white; border:none;
        border-radius:8px; cursor:pointer; font-size:14px; font-weight:bold;
    }
</style>

<div class="area-manutencao" oncontextmenu="event.preventDefault(); abrirModalSenha();">
    <div class="texto-manutencao">Em manutenção</div>
</div>

<div id="modal-senha-fundo">
    <div id="modal-senha-caixa">
        <label>Não entre se não for administrador</label>
        <input type="password" id="campo-senha-oculta" autocomplete="off">
        <button onclick="conferirSenha()">Entrar</button>
    </div>
</div>

<script>
    function abrirModalSenha() {
        document.getElementById("modal-senha-fundo").style.display = "flex";
        document.getElementById("campo-senha-oculta").value = "";
        document.getElementById("campo-senha-oculta").focus();
    }

    function conferirSenha() {
        const valor = document.getElementById("campo-senha-oculta").value;
        if (valor === "Isac") {
            window.location.href = "{{ url_for('admin_excel_real') }}";
        } else {
            document.getElementById("modal-senha-fundo").style.display = "none";
        }
    }

    document.getElementById("campo-senha-oculta").addEventListener("keydown", function (evento) {
        if (evento.key === "Enter") conferirSenha();
    });

    document.getElementById("modal-senha-fundo").addEventListener("click", function (evento) {
        if (evento.target.id === "modal-senha-fundo") {
            document.getElementById("modal-senha-fundo").style.display = "none";
        }
    });
</script>

{% endblock %}--!>
